server:
  port: ${SKY_CATALOG_PORT:8083}
spring:
  application:
    name: catalog-service
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:catalog-service.yml}
  cloud:
    openfeign:
      httpclient:
        enabled: true
        connection-timeout: 1000
        max-connections: ${SKY_FEIGN_MAX_CONNECTIONS:512}
        max-connections-per-route: ${SKY_FEIGN_MAX_PER_ROUTE:256}
        time-to-live: 60
        time-to-live-unit: seconds
        hc5:
          enabled: true
          connection-request-timeout: 1
          connection-request-timeout-unit: seconds
          socket-timeout: 3
          socket-timeout-unit: seconds
      micrometer:
        enabled: true
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 1500
          trade-service:
            connectTimeout: 1000
            readTimeout: 1500
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        feign-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            data-id: ${SKY_SENTINEL_CATALOG_FLOW_DATA_ID:catalog-service-sentinel-flow.json}
            group-id: ${SKY_SENTINEL_GROUP:DEFAULT_GROUP}
            data-type: json
            rule-type: flow
        feign-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            data-id: ${SKY_SENTINEL_CATALOG_DEGRADE_DATA_ID:catalog-service-sentinel-degrade.json}
            group-id: ${SKY_SENTINEL_GROUP:DEFAULT_GROUP}
            data-type: json
            rule-type: degrade
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    default: prod
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      timeout: ${SKY_REDIS_TIMEOUT:2s}
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${SKY_CATALOG_REDIS_DATABASE:12}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
feign:
  sentinel:
    enabled: true
  circuitbreaker:
    enabled: true
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DB_HOST:127.0.0.1}
    port: ${SKY_DB_PORT:3306}
    database: ${SKY_CATALOG_DB:sky_take_out_catalog}
    username: ${SKY_DB_USER:}
    password: ${SKY_DB_PASSWORD:}
  redis:
    host: ${SKY_REDIS_HOST:127.0.0.1}
    port: ${SKY_REDIS_PORT:6379}
    password: ${SKY_REDIS_PASSWORD:}
  security:
    docs-enabled: false
    cors-origins: ${SKY_CORS_ORIGINS:}
  internal:
    token: ${SKY_INTERNAL_TOKEN:}
  jwt:
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:}
    admin-ttl: 7200000
    admin-token-name: token
    user-secret-key: ${SKY_JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: authentication
  alioss:
    endpoint: ${SKY_OSS_ENDPOINT:}
    access-key-id: ${SKY_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${SKY_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${SKY_OSS_BUCKET:}
