server:
  port: ${SKY_NOTIFICATION_PORT:8084}
spring:
  application:
    name: notification-service
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:notification-service.yml}
  cloud:
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  data:
    redis:
      host: ${SKY_REDIS_HOST:127.0.0.1}
      port: ${SKY_REDIS_PORT:6379}
      password: ${SKY_REDIS_PASSWORD:}
      database: ${SKY_NOTIFICATION_REDIS_DATABASE:13}
  rabbitmq:
    host: ${SKY_RABBIT_HOST:127.0.0.1}
    port: ${SKY_RABBIT_PORT:5672}
    username: ${SKY_RABBIT_USER:guest}
    password: ${SKY_RABBIT_PASSWORD:guest}
    virtual-host: ${SKY_RABBIT_VHOST:/}
    listener:
      simple:
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
sky:
  jwt:
    # Must match the user JWT key used by account/catalog/trade services.
    user-secret-key: ${SKY_JWT_USER_SECRET:itheima}
    user-token-name: authentication
  internal:
    token: ${SKY_INTERNAL_TOKEN:dev-only-change-me}
  websocket:
    allow-query-token: ${SKY_GATEWAY_ALLOW_WEBSOCKET_QUERY_TOKEN:false}
