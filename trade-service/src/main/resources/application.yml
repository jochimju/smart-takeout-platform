server:
  tomcat:
    accept-count: ${SKY_HTTP_ACCEPT_COUNT:1024}
    max-connections: ${SKY_HTTP_MAX_CONNECTIONS:4096}
    threads:
      max: ${SKY_HTTP_MAX_THREADS:256}
      min-spare: 32
  port: ${SKY_TRADE_PORT:8081}

spring:
  application:
    name: trade-service
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:trade-service.yml}
  cloud:
    openfeign:
      httpclient:
        enabled: true
        connection-timeout: 1000
        max-connections: ${SKY_FEIGN_MAX_CONNECTIONS:512}
        max-connections-per-route: ${SKY_FEIGN_MAX_PER_ROUTE:256}
        time-to-live: 60
        time-to-live-unit: seconds
        hc5:
          enabled: true
          connection-request-timeout: 1
          connection-request-timeout-unit: seconds
          socket-timeout: 3
          socket-timeout-unit: seconds
      micrometer:
        enabled: true
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 2000
          catalog-service:
            connectTimeout: 1000
            readTimeout: 2500
    sentinel:
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        feign-flow:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            data-id: ${SKY_SENTINEL_TRADE_FLOW_DATA_ID:trade-service-sentinel-flow.json}
            group-id: ${SKY_SENTINEL_GROUP:DEFAULT_GROUP}
            data-type: json
            rule-type: flow
        feign-degrade:
          nacos:
            server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
            namespace: ${NACOS_NAMESPACE:}
            username: ${NACOS_USERNAME:}
            password: ${NACOS_PASSWORD:}
            data-id: ${SKY_SENTINEL_TRADE_DEGRADE_DATA_ID:trade-service-sentinel-degrade.json}
            group-id: ${SKY_SENTINEL_GROUP:DEFAULT_GROUP}
            data-type: json
            rule-type: degrade
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    default: prod
  main:
    allow-circular-references: true
  datasource:
    druid:
      initial-size: ${SKY_DB_INITIAL_SIZE:8}
      min-idle: ${SKY_DB_MIN_IDLE:8}
      max-active: ${SKY_DB_MAX_ACTIVE:32}
      max-wait: ${SKY_DB_MAX_WAIT_MS:1000}
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}
  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    virtual-host: ${sky.rabbitmq.virtual-host}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        concurrency: 3
        max-concurrency: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    # The current baseline intentionally removed the earlier multi-canteen migration files.
    # Existing databases retain their history, while all migrations still present are validated.
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration
feign:
  # Sentinel provides fallbackFactory execution; circuitbreaker rules are loaded from Nacos.
  sentinel:
    enabled: true
  circuitbreaker:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  seckill:
    stock-buckets: ${SKY_SECKILL_STOCK_BUCKETS:8}
    fulfill-batch-size: ${SKY_SECKILL_FULFILL_BATCH_SIZE:8}
    max-outstanding: ${SKY_SECKILL_MAX_OUTSTANDING:500}
    processing-seconds: ${SKY_SECKILL_PROCESSING_SECONDS:120}
  payment:
    mock-enabled: ${SKY_PAYMENT_MOCK_ENABLED:false}
    recovery:
      enabled: ${SKY_PAYMENT_RECOVERY_ENABLED:true}
      interval-ms: 1000
    reconciliation:
      enabled: ${SKY_PAYMENT_RECONCILIATION_ENABLED:true}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: ${SKY_DB_HOST:127.0.0.1}
    port: ${SKY_DB_PORT:3306}
    database: ${SKY_TRADE_DB:sky_take_out_trade}
    username: ${SKY_DB_USER:}
    password: ${SKY_DB_PASSWORD:}
  redis:
    host: ${SKY_REDIS_HOST:127.0.0.1}
    port: ${SKY_REDIS_PORT:6379}
    password: ${SKY_REDIS_PASSWORD:}
    database: ${SKY_TRADE_REDIS_DATABASE:10}
  rabbitmq:
    host: ${SKY_RABBIT_HOST:127.0.0.1}
    port: ${SKY_RABBIT_PORT:5672}
    username: ${SKY_RABBIT_USER:}
    password: ${SKY_RABBIT_PASSWORD:}
    virtual-host: ${SKY_RABBIT_VHOST:/}
  security:
    docs-enabled: false
    cors-origins: ${SKY_CORS_ORIGINS:}
  internal:
    token: ${SKY_INTERNAL_TOKEN:}
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    #下面三条是用户端的
    user-secret-key: ${SKY_JWT_USER_SECRET:}
    user-ttl: 7200000
    user-token-name: authentication

  alioss:
    endpoint: ${SKY_OSS_ENDPOINT:}
    access-key-id: ${SKY_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${SKY_OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${SKY_OSS_BUCKET:}

  wechat:
    api-base-url: https://api.mch.weixin.qq.com
    auto-update-certificates: ${SKY_WECHAT_AUTO_UPDATE_CERTIFICATES:true}
    platform-certificate-paths: ${SKY_WECHAT_PLATFORM_CERTIFICATE_PATHS:}
    public-key-id: ${SKY_WECHAT_PUBLIC_KEY_ID:}
    public-key-file-path: ${SKY_WECHAT_PUBLIC_KEY_PATH:}
    appid: ${SKY_WECHAT_APPID:}
    secret: ${SKY_WECHAT_SECRET:}
    mchid: ${SKY_WECHAT_MCHID:}
    mchSerialNo: ${SKY_WECHAT_MCH_SERIAL_NO:}
    privateKeyFilePath: ${SKY_WECHAT_PRIVATE_KEY_PATH:}
    apiV3Key: ${SKY_WECHAT_API_V3_KEY:}
    weChatPayCertFilePath: ${SKY_WECHAT_PAY_CERT_PATH:}
    notifyUrl: ${SKY_WECHAT_NOTIFY_URL:}
    refundNotifyUrl: ${SKY_WECHAT_REFUND_NOTIFY_URL:}

