server:
  port: ${SKY_TRADE_PORT:8081}

spring:
  application:
    name: trade-service
  config:
    import: ${NACOS_CONFIG_IMPORT:optional:nacos:trade-service.yml}
  cloud:
    openfeign:
      client:
        config:
          account-service:
            connectTimeout: 1000
            readTimeout: 2000
          catalog-service:
            connectTimeout: 1000
            readTimeout: 2500
    nacos:
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database}
  rabbitmq:
    host: ${sky.rabbitmq.host}
    port: ${sky.rabbitmq.port}
    username: ${sky.rabbitmq.username}
    password: ${sky.rabbitmq.password}
    virtual-host: ${sky.rabbitmq.virtual-host}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
        concurrency: 3
        max-concurrency: 10
  flyway:
    enabled: true
    baseline-on-migrate: true
    # The current baseline intentionally removed the earlier multi-canteen migration files.
    # Existing databases retain their history, while all migrations still present are validated.
    ignore-migration-patterns: "*:missing"
    locations: classpath:db/migration
mybatis-plus:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  internal:
    token: ${SKY_INTERNAL_TOKEN:dev-only-change-me}
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${SKY_JWT_ADMIN_SECRET:itcast}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    #下面三条是用户端的
    user-secret-key: ${SKY_JWT_USER_SECRET:itheima}
    user-ttl: 7200000
    user-token-name: authentication

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}

  wechat:
    appid: ${sky.wechat.appid}
    secret: ${sky.wechat.secret}
    mchid: ${sky.wechat.mchid}
    mchSerialNo: ${sky.wechat.mchSerialNo}
    privateKeyFilePath: ${sky.wechat.privateKeyFilePath}
    apiV3Key: ${sky.wechat.apiV3Key}
    weChatPayCertFilePath: ${sky.wechat.weChatPayCertFilePath}
    notifyUrl: ${sky.wechat.notifyUrl}
    refundNotifyUrl: ${sky.wechat.refundNotifyUrl}

