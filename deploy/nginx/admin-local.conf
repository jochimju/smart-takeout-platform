# Example server block inside nginx's http section. Frontend assets live in html/sky.
# Preserve Host at BOTH proxy hops; gateway uses PreserveHostHeader.
server {
    listen 80;
    server_name localhost;
    proxy_set_header Host $http_host;
    location / { root html/sky; index index.html; }
    location /api/ { proxy_pass http://127.0.0.1:8080/admin/; }
    location /user/ { proxy_pass http://127.0.0.1:8080/user/; }
    location /dishes/ { proxy_pass http://127.0.0.1:8080/dishes/; }
    location /setmeals/ { proxy_pass http://127.0.0.1:8080/setmeals/; }
    location /ws/ {
        proxy_pass http://127.0.0.1:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
